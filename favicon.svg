<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Retro Pixel Art Cricket Ball Favicon -->
  
  <!-- Ball Outer Silhouette / Shadow -->
  <rect x="8" y="4" width="16" height="24" fill="#5D0C0C" />
  <rect x="4" y="8" width="24" height="16" fill="#5D0C0C" />
  <rect x="6" y="6" width="20" height="20" fill="#5D0C0C" />

  <!-- Ball Main Red Body -->
  <rect x="9" y="5" width="14" height="22" fill="#D32F2F" />
  <rect x="5" y="9" width="22" height="14" fill="#D32F2F" />
  <rect x="7" y="7" width="18" height="18" fill="#D32F2F" />

  <!-- Shading / Highlights (Top Left 3D effect) -->
  <rect x="9" y="6" width="6" height="2" fill="#FF5252" />
  <rect x="7" y="8" width="2" height="6" fill="#FF5252" />
  <rect x="9" y="8" width="2" height="2" fill="#FF5252" />
  
  <!-- Deep Shadow (Bottom Right) -->
  <rect x="17" y="24" width="6" height="2" fill="#8B0000" />
