  <rect x="15" y="13" width="1" height="1" fill="#FFD700" />
  <rect x="13" y="15" width="1" height="1" fill="#FFD700" />

  <rect x="17" y="15" width="1" height="1" fill="#FFD700" />
  <rect x="15" y="17" width="1" height="1" fill="#FFD700" />
  <rect x="19" y="17" width="1" height="1" fill="#FFD700" />
  <rect x="17" y="19" width="1" height="1" fill="#FFD700" />

  <rect x="21" y="19" width="1" height="1" fill="#FFD700" />
  <rect x="19" y="21" width="1" height="1" fill="#FFD700" />
  <rect x="23" y="21" width="1" height="1" fill="#FFD700" />
  <rect x="21" y="23" width="1" height="1" fill="#FFD700" />
