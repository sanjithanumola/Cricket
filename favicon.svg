  <rect x="21" y="22" width="2" height="2" fill="#8B0000" />

  <!-- Central Seam (White and Gold Pixelated Stitching) -->
  <!-- Diagonal Seam from Top-Left to Bottom-Right -->
  <rect x="8" y="8" width="2" height="2" fill="#FFFFFF" />
  <rect x="10" y="10" width="2" height="2" fill="#EAEAEA" />
  <rect x="12" y="12" width="2" height="2" fill="#FFFFFF" />
  <rect x="14" y="14" width="2" height="2" fill="#EAEAEA" />
  <rect x="16" y="16" width="2" height="2" fill="#FFFFFF" />
  <rect x="18" y="18" width="2" height="2" fill="#EAEAEA" />
  <rect x="20" y="20" width="2" height="2" fill="#FFFFFF" />
  <rect x="22" y="22" width="2" height="2" fill="#EAEAEA" />

  <!-- Seam golden highlights/threads flanking -->
  <rect x="9" y="7" width="1" height="1" fill="#FFD700" />
  <rect x="7" y="9" width="1" height="1" fill="#FFD700" />
  <rect x="11" y="9" width="1" height="1" fill="#FFD700" />
  <rect x="9" y="11" width="1" height="1" fill="#FFD700" />
  
  <rect x="13" y="11" width="1" height="1" fill="#FFD700" />
